# spritpreis.cfg - Zugangsdaten fuer den Spritpreis-Monitor (CYD)
#
# Diese Datei gehoert auf die microSD des Geraets:  /sdcard/spritpreis.cfg
# Das Geraet legt sie beim ersten Start mit Karte selbst an - diese Kopie
# ist zum Nachschauen und fuer den Fall, dass man sie von Hand aufspielen
# will (Karte in den PC, Datei ins Hauptverzeichnis kopieren).
#
# So geht es:
#   1. Werte eintragen - hinter dem = steht jeweils der Platzhalter, der
#      ersetzt wird. Zeilen mit # sind Kommentar. Werte ohne umgebende
#      Leerzeichen eintragen.
#   2. Karte ins Geraet stecken und das Geraet neu starten.
#   3. Das Geraet uebernimmt die Werte in seinen Flash (NVS) und setzt diese
#      Datei wieder auf die Platzhalter zurueck. Die Geheimnisse liegen dann
#      nur noch im Geraet, nicht mehr auf der Karte.
#
# Jeder Wert wird einzeln geprueft: steht noch ein Platzhalter da, wird er
# ignoriert. WLAN wird nur uebernommen, wenn ssid UND pass eingetragen sind.
# Es reicht also, nur die Werte nachzutragen, die man gerade hat.
#
# Tankstellen-ID:  tools/find_station.ps1 -ApiKey <key> -Ort "<strasse ort>"
# API-Key:         https://creativecommons.tankerkoenig.de/ (kostenlos)
# WLAN:            Name und Passwort des 2,4-GHz-Netzes
# Simulation:      nur noetig, solange kein API-Key da ist (on / off)

station=HIER_TANKSTELLEN_ID_EINTRAGEN
apikey=HIER_API_KEY_EINTRAGEN
ssid=HIER_WLAN_NAME_EINTRAGEN
pass=HIER_WLAN_PASSWORT_EINTRAGEN

# sim= hier on oder off eintragen (leer lassen = nichts aendern)
sim=

# fill= hier z. B. 13 eintragen: erzeugt Testverlauf (1..13 Tage stuendlich,
# dazu Tageswerte bis 30 Tage). Geht erst, wenn die Uhr gestellt ist.
fill=
